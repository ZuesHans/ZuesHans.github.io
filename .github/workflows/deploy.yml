# GitHub Actions workflow for Cloudflare Workers deployment
# Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Set repository variable CLOUDFLARE_DEPLOY_ENABLED=true to enable deployment.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Copy pre-rendered HTML to assets
        run: |
          mkdir -p .open-next/assets
          find .next/server/app -name "*.html" -exec cp --parents {} .open-next/assets/ \;
          if [ -f .next/server/app/_not-found.html ]; then
            cp .next/server/app/_not-found.html .open-next/assets/404.html
          fi

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "."
          command: deploy --dry-run=false