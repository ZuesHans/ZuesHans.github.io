# -----------------
# 1. 头像 /图标
favicon: /img/cover_2.jpg
avatar:
  img: /img/cover_2.jpg
  effect: false 

# -----------------
# 2. 头图 
index_img: /img/cover_1.png
default_top_img: /img/cover_3.png

# -----------------
# 主页副标题 (打字机)
subtitle:
  enable: false
  effect: true
  sub:
     - 'a coding cat_with love in its heart'
     - 'Hamilton musical|Mazda RX7|CSisfate'
     - 'Welcome to my little bag.'

index_layout: 6

#------------------
# 文章预浏览展示
index_post_content:
  method: 4

# -----------------
# 社交图标 (Social Icons)
social:
  fas fa-envelope: mailto:kai779@qq.com || 最正经的联系我的方式
  fab fa-github: https://github.com/ZuesHans || GitHub
  fas fa-code: https://codeforces.com/profile/keronshans || 不要时间我啊555

# -----------------
# 3. 菜单 (Menu)
menu:
  主页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  links: /link/ || fas fa-link
  關於: /about/ || fas fa-heart
  音樂: /music/ || fas fa-music

# -----------------
# 侧边栏 (Aside)
aside:
  card_announcement:
    enable: true
    content: |
      这里是一只会打字的小猫<br>
      欢迎来找我玩！<br>
      小猫永远喜欢unk大人/小声<br>
      <a href="https://codeforces.com/profile/keronshans" target="_blank">
        <img src="https://codeforces-readme-stats.vercel.app/api/card?username=keronshans&theme=radical" style="width:100%; border-radius: 8px;" alt="Codeforces Stats">
      </a>

# -----------------
# 首页文章封面 
# -----------------
# 确保你文章的 Front-matter (开头信息) 中设置了 'cover' 字段
index_post_cover:
  enable: true
  position: top # 封面图显示在卡片顶部

# -----------------
# 代码块样式增强
code_blocks:
  # Code block theme: darker / pale night / light / ocean / false
  theme: pale night
  macStyle: true
  # Code block height limit (unit: px)
  height_limit: false
  word_wrap: false

  # Toolbar
  copy: true
  language: true
  # true: shrink the code blocks | false: expand the code blocks | none: expand code blocks and hide the button
  shrink: true
  fullpage: false



# -----------------
# 数学公式 (Math)
math:
  enable: true
  per_page: false # 开启后，需要在文章的 front-matter 里写 math: true 才会加载公式
  katex:
    enable: true
    hide_scrollbar: true
# 2. 页面加载动画 
preloader:
  enable: true
  source: 1 # 1=普通的旋转圈, 3=很多圈 (你可以试试改成 1 到 10 的数字)
# 4. 底部数据统计 (Busuanzi)
# 它可以统计你有多少个访客 (UV) 和点击量 (PV)
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# 5. 网站运行时间 
footer:
  owner:
    enable: true
    since: 2025 # 修改为你建站的年份
  custom_text: 'I am a little coding cat . PLZ love me' # 底部自定义文字
  copyright: true



post_copyright:
  enable: true
  decode: true # 解码版权信息
  author_href: true # 作者链接
  license: 'CC BY-NC-SA 4.0' # 知识共享协议
  license_url: 'https://creativecommons.org/licenses/by-nc-sa/4.0/'



inject:
  bottom:
    - <script src="/js/crash_cheat.js"></script>

#---------------------
# 页面mata展示
#---------------------
post_meta:
  # Home Page
  page:
    # Choose: created / updated / both
    date_type: updated
    # Choose: date / relative
    date_format: date
    categories: true
    tags: true
    label: true
  post:
    # Choose: left / center
    position: left
    # Choose: created / updated / both
    date_type: both
    # Choose: date / relative
    date_format: date
    categories: true
    tags: true
    label: true

#-----------------------
# 本地搜索
search:
  use: local_search  # 这里填 local_search

# Local Search
local_search:
  # 是否预加载（建议 false，节省流量；如果想要极致速度设为 true）
  preload: false
  # 每篇文章显示多少条结果
  top_n_per_article: 1
  # 是否解码 HTML（保持默认 false 即可）
  unescape: false
  # CDN 留空即可使用本地生成的 search.xml
  CDN: