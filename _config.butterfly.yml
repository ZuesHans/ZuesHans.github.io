# -----------------
# 1. 头像 (Avatar)

favicon: /img/头像im.jpg
# -----------------
avatar:
  img: /img/头像im.jpg
  effect: false 

# -----------------
# 2. 头图 (Banner)
# -----------------
# 首页头图
index_img: /img/夏至.png
# 其他页面的默认头图
default_top_img: /img/杜预.png

# -----------------
# 主页副标题 (打字机)
# -----------------
subtitle:
  enable: true
  effect: true
  loop: true
  sub:
    - 'a coding cat_with love in its heart'
    - 'Hamilton musical|Mazda RX7|CSisfate'
    - 'Welcome to my little bag.'

# -----------------
# 社交图标 (Social Icons)
# -----------------
social:
  fas fa-envelope: mailto:kai779@qq.com || 最正经的联系我的方式
  fab fa-github: https://github.com/ZuesHans || GitHub
  fas fa-rss: /atom.xml || RSS
  fas fa-code: https://codeforces.com/profile/keronshans || 不要时间我啊555

# -----------------
# 3. 菜单 (Menu)
# -----------------
menu:
  主页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  links: /link/ || fas fa-link

# -----------------
# 侧边栏 (Aside)
# -----------------
aside:
  # 公告
  card_announcement:
    enable: true
    content: '这里是一只会打字的小猫<br>欢迎来找我玩！<br>小猫永远喜欢unk大人/小声'

# -----------------
# 首页文章封面 (!! 新增以满足你的需求)
# -----------------
# 确保你文章的 Front-matter (开头信息) 中设置了 'cover' 字段
index_post_cover:
  enable: true
  position: top # 封面图显示在卡片顶部

  # -----------------
# 数学公式 (Math)
# -----------------
# 详情: https://butterfly.js.org/posts/ceeb7cbf/
math:
  enable: true
  engine: 'mathjax' 
  per_page: false