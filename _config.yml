# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: ZuesHans's little bag
subtitle: 'a coding cat_with love in its heart'
description: ''
keywords:
author: KeronsHans
language: zh-CN
timezone: ''

# URL
## Set your site url here. For example, if you use GitHub Page,set url as 'https://username.github.io/project'
url: https://ZuesHans.github.io
root: /
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
# ----------------------------------------
# 针对 hexo-renderer-markdown-it-plus 的配置
# ----------------------------------------

markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: true
    linkify: true
    typographer: true
    quotes: '""''""'
  plugins:
    # 确保这个插件还在
    - plugin: markdown-it-katex

# Search 插件配置
search:
  path: search.xml
  field: post
  content: true
  format: striptags

# -------音模块-------
aplayer:
  meting: true
  asset_inject: true # 这里的设置取决于你的主题，如果播放器不显示，改为 true 试试
  # 下面是全局吸底播放器的配置
  fixed: true       # 开启吸底模式
  mini: false       # 默认不折叠
  autoplay: false   # 再次提醒：浏览器通常会拦截自动播放，建议 false
  theme: '#b7daff'  # 播放器颜色，可以改成你喜欢的赛博朋克粉/蓝
  loop: all
  order: list
  preload: auto
  volume: 0.7
  list_folded: true
  # 歌单信息
  server: tencent   # netease=网易云, tencent=QQ音乐
  type: song #playlist    # 歌单
  id: '004XpUu80lUPOh'    # 去网易云网页版复制歌单 ID